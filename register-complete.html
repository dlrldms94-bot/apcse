<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>등록 완료 | APCSE</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="logo">APCSE 사전등록</a>
      <nav class="site-nav">
        <a href="index.html">사전등록</a>
        <a href="mypage.html">마이페이지</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <h1 class="page-title" id="title">사전등록 완료</h1>

    <div class="card">
      <p class="page-desc" id="desc" style="text-align:left;margin-bottom:16px;"></p>
      <div id="bodyText" style="color:#475569;line-height:1.7;text-align:left;"></div>
      <div class="actions complete-home-actions">
        <a href="index.html" class="btn btn-primary" id="homeBtn">홈으로</a>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const isForeigner = params.get("type") === "foreigner";

    if (isForeigner) {
      document.documentElement.lang = "en";
      document.title = "Registration Complete | APCSE";
      document.getElementById("title").textContent = "Registration Complete";
      document.getElementById("desc").textContent =
        "Your pre-registration has been successfully submitted. Thank you for registering for APCSE 2026.";
      document.getElementById("bodyText").innerHTML = `
        <p>Your registration information will be reviewed in the order received. Once the review is complete, you will be notified of your registration status via your registered email address.</p>
        <p style="margin-top:16px;">Please note that your registration will only be confirmed upon receipt of a confirmation email.</p>
      `;
      document.getElementById("homeBtn").textContent = "Home";
    } else {
      document.getElementById("desc").textContent =
        "사전등록이 정상적으로 접수되었습니다. 신청해 주셔서 감사합니다.";
      document.getElementById("bodyText").innerHTML = `
        <p>제출하신 참석 정보를 순차적으로 확인한 후, 참가 확정 여부를 등록하신 이메일로 안내드리겠습니다.</p>
        <p style="margin-top:16px;">참가 확정 안내를 받기 전까지는 등록이 완료된 상태가 아니므로 참고 부탁드립니다.</p>
      `;
    }
  </script>
</body>
</html>
