<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APCSE 2026 사전등록</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body class="home-page">
  <header class="home-header">
    <a href="index.html" class="home-logo">APCSE 사전등록</a>
    <a href="mypage.html" class="home-mypage-btn">마이페이지</a>
  </header>

  <main class="home-main">
    <h1 class="home-title">사전등록</h1>
    <p class="home-desc">참가 유형을 선택해 주세요.</p>

    <div class="home-choice-panel">
      <div class="home-choice-grid">
        <a href="#" class="home-choice primary" id="domesticChoice" role="button">
          내국인 사전 등록
          <small>Domestic Pre-Registration</small>
        </a>
        <a href="register-foreigner.html" class="home-choice secondary">
          International<br>Pre-registration
        </a>
      </div>
    </div>
  </main>

  <footer class="home-footer">
    <!-- 발주처 메인 사이트 URL로 href 변경 -->
    <a href="#" class="home-return">
      <span class="home-return-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3.5L4 10.5V20C4 20.5523 4.44772 21 5 21H10V15H14V21H19C19.5523 21 20 20.5523 20 20V10.5L12 3.5Z" fill="white"/>
        </svg>
      </span>
      <span>메인으로 돌아가기</span>
    </a>
  </footer>

  <div id="domesticNotice" class="home-notice" hidden>
    <div class="home-notice-backdrop" id="domesticNoticeBackdrop"></div>
    <div class="home-notice-panel" role="dialog" aria-labelledby="domesticNoticeTitle">
      <p id="domesticNoticeTitle" class="home-notice-text">내국인 사전 등록은 8월 중 오픈 예정입니다.</p>
      <button type="button" class="home-notice-btn" id="domesticNoticeClose">확인</button>
    </div>
  </div>

  <script>
    const domesticNotice = document.getElementById("domesticNotice");
    const showDomesticNotice = () => {
      domesticNotice.hidden = false;
    };
    const hideDomesticNotice = () => {
      domesticNotice.hidden = true;
    };

    document.getElementById("domesticChoice").addEventListener("click", (e) => {
      e.preventDefault();
      showDomesticNotice();
    });
    document.getElementById("domesticNoticeClose").addEventListener("click", hideDomesticNotice);
    document.getElementById("domesticNoticeBackdrop").addEventListener("click", hideDomesticNotice);

    if (new URLSearchParams(location.search).get("domestic") === "closed") {
      showDomesticNotice();
      history.replaceState(null, "", "index.html");
    }
  </script>
</body>
</html>
