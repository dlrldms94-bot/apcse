<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>워크숍 세션 사전 참여 신청 | APCSE</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/form.css">
  <script src="js/workshop-survey-schedule.js"></script>
  <script>
    if (!WorkshopSurveySchedule.isDomesticWorkshopSurveyOpen()) {
      location.replace("index.html?workshop-domestic=closed");
    }
  </script>
</head>
<body>
  <header class="home-header">
    <a href="index.html" class="home-logo">APCSE 사전등록</a>
    <a href="mypage.html" class="home-mypage-btn">마이페이지</a>
  </header>

  <main class="page">
    <h1 class="page-title">워크숍 세션 사전 참여 신청</h1>

    <div class="card">
      <form id="workshopSurveyForm" class="form-grid">
        <div class="survey-intro-notice">
          <p>본 수요조사는 사전등록자를 대상으로 합니다.<br>사전등록하지 않은 분의 응답은 최종 집계에서 제외됩니다.</p>
        </div>

        <div class="field">
          <label>이름 <span class="req">*</span></label>
          <input type="text" name="name" required autocomplete="name">
        </div>

        <div class="field">
          <label>소속 <span class="req">*</span></label>
          <input type="text" name="affiliation" required autocomplete="organization">
        </div>

        <div class="field">
          <label>휴대전화 <span class="req">*</span></label>
          <input type="tel" name="phone" placeholder="010-0000-0000" pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}" required autocomplete="tel">
        </div>

        <div class="field">
          <label>이메일 <span class="req">*</span></label>
          <input type="email" name="email" required autocomplete="email">
        </div>

        <div class="field">
          <label>1. 실습 참여를 희망하는 워크숍 세션을 선택해 주세요. <span class="req">*</span></label>
          <p class="hint">(운영 장소: Conference Room A Sun+Cloud)</p>
          <div class="checkbox-group workshop-session-list" data-workshop-sessions></div>
          <p class="hint">최대 2개 선택 가능합니다. 워크숍별 선착순 정원(내국인 20명)입니다.</p>
          <p class="hint">실습 신청이 마감된 경우에도 일반 참관은 가능합니다.</p>
        </div>

        <div id="errorBox" class="alert error" hidden></div>

        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn" disabled>제출하기</button>
          <a href="index.html" class="btn btn-secondary">돌아가기</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/workshop-sessions.js"></script>
  <script src="js/workshop-survey-form.js"></script>
  <script>
    initWorkshopSurveyForm(document.getElementById("workshopSurveyForm"), {
      type: "DOMESTIC",
      lang: "ko",
      maxSelections: 2,
      completeUrl: "workshop-survey-complete.html?lang=ko",
      messages: {
        basicsRequired: "이름, 소속, 휴대전화, 이메일, 실습 참여 희망 워크숍을 모두 입력·선택해 주세요.",
        maxSelections: "워크숍은 최대 2개까지 선택할 수 있습니다.",
        submitting: "제출 중...",
        submitLabel: "제출하기",
        failure: "제출에 실패했습니다. 잠시 후 다시 시도해 주세요.",
        allSlotsFull: "선택 가능한 워크숍 실습 정원이 모두 마감되었습니다. (일반 참관은 현장에서 가능합니다.)",
        slotFullHint: "※ 정원(20명) 마감",
      },
    });
  </script>
</body>
</html>
