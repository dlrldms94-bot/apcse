<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글로벌 네트워킹 세션 사전 수요조사 | APCSE</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/form.css">
  <script src="js/networking-survey-schedule.js"></script>
  <script>
    if (!NetworkingSurveySchedule.isDomesticNetworkingSurveyOpen()) {
      location.replace("index.html?networking-domestic=closed");
    }
  </script>
</head>
<body>
  <header class="home-header">
    <a href="index.html" class="home-logo">APCSE 사전등록</a>
    <a href="mypage.html" class="home-mypage-btn">마이페이지</a>
  </header>

  <main class="page">
    <h1 class="page-title">글로벌 네트워킹 세션 사전 수요조사</h1>

    <div class="card">
      <form id="networkingSurveyForm" class="form-grid">
        <div class="field">
          <label>1. 이름 <span class="req">*</span></label>
          <input type="text" name="name" required autocomplete="name">
          <p class="hint">이름을 입력해 주세요.</p>
        </div>

        <div class="field">
          <label>2. 소속 <span class="req">*</span></label>
          <input type="text" name="affiliation" required autocomplete="organization">
          <p class="hint">소속 기관 또는 단체명을 입력해 주세요.</p>
        </div>

        <div class="field">
          <label>3. 참석을 희망하는 세션을 선택해 주세요. <span class="req">*</span></label>
          <div class="checkbox-group">
            <label class="checkbox-row">
              <input type="checkbox" name="sessionDates" value="2026-10-15">
              <span>10월 15일(목) 글로벌 네트워킹 세션<br><span class="hint" data-slot-full-hint hidden>※ 정원(20명) 마감</span></span>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" name="sessionDates" value="2026-10-16">
              <span>10월 16일(금) 글로벌 네트워킹 세션<br><span class="hint" data-slot-full-hint hidden>※ 정원(20명) 마감</span></span>
            </label>
          </div>
          <p class="hint">※ 복수 선택 가능합니다. 세션별 선착순 20명입니다.</p>
        </div>

        <div class="conditional-block" data-topic-block hidden>
          <div class="field">
            <label>4. 네트워킹 세션에서 논의하고 싶은 주제를 자유롭게 작성해 주세요.</label>
          </div>
          <div class="field networking-topic-field" data-topic-for="2026-10-15" hidden>
            <label for="discussionTopic20261015">10월 15일(목) 논의 주제</label>
            <textarea id="discussionTopic20261015" name="discussionTopic_2026-10-15" rows="4" placeholder="10월 15일 세션에서 논의하고 싶은 주제를 입력해 주세요."></textarea>
          </div>
          <div class="field networking-topic-field" data-topic-for="2026-10-16" hidden>
            <label for="discussionTopic20261016">10월 16일(금) 논의 주제</label>
            <textarea id="discussionTopic20261016" name="discussionTopic_2026-10-16" rows="4" placeholder="10월 16일 세션에서 논의하고 싶은 주제를 입력해 주세요."></textarea>
          </div>
          <p class="hint">※ 수합된 의견 중 주요 주제를 선정하여 네트워킹 세션의 논의 주제로 활용할 예정입니다.</p>
        </div>

        <div id="errorBox" class="alert error" hidden></div>

        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn" disabled>제출하기</button>
          <a href="index.html" class="btn btn-secondary">돌아가기</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/networking-survey-form.js"></script>
  <script>
    initNetworkingSurveyForm(document.getElementById("networkingSurveyForm"), {
      type: "DOMESTIC",
      completeUrl: "networking-survey-complete.html?lang=ko",
      messages: {
        basicsRequired: "이름, 소속, 참석 희망 세션을 모두 입력·선택해 주세요.",
        submitting: "제출 중...",
        submitLabel: "제출하기",
        failure: "제출에 실패했습니다. 잠시 후 다시 시도해 주세요.",
        allSlotsFull: "모든 세션 정원(20명)이 마감되어 제출할 수 없습니다.",
      },
    });
  </script>
</body>
</html>
